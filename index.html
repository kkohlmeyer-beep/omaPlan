
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Familienplan</title>

<style>
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100dvh; 
  display: flex;
  justify-content: center;
  align-items: center;
}

  /* Tag */
  body.day {
    background: white;
    color: black;
  }

  /* Nacht */
  body.night {
    background: black;
    color: #888;
  }

 
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}


h1 {
  font-weight: normal;
  margin: 0;
  padding: 0;

  width: 100%;              /* ✅ wichtig für horizontale Zentrierung */

  display: flex;            /* ✅ aktiviert echtes Zentrieren */
  align-items: center;      /* ✅ vertikal */
  justify-content: center;  /* ✅ horizontal */

  text-align: center;       /* ✅ wichtig für mehrzeiligen Text */

  
  white-space: pre-wrap;
}



table {
  border-collapse: collapse;

  width: 95%;
  margin-left: auto;
  margin-right: auto;

  margin-top: auto;
  margin-bottom: 2.5%;        /* ✅ dein Abstand */
}




  td {
    border: 1px solid currentColor;
    
    width: 50%;
    

  padding-top: 0.2em;
  padding-bottom: 0.2em;
  padding-left: 0.5em;
  padding-right: 0.5em;
}


    
tr {
  height: 12dvh;
}



  /* Zustände */
  .past {
    color: #aaa;
  }

  .current {
    font-weight: bold;
  }

  /* Nacht-Message */
.message {
  width: 80%;
  height: 50%;        /* ✅ DAS fehlte wirklich */

  margin-left: auto;
  margin-right: auto;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  color: #ddd;
}

.message span {
  display: block;
}

.message b {
  display: block;
  white-space: nowrap;   /* ✅ verhindert Umbruch */
}



</style>
</head>

<body>

<div id="app" class="container"></div>

<script src="data.js"></script>

<script>
const now = new Date();

const params = new URLSearchParams(window.location.search);
const hourParam = params.get("hour");

const hour = (hourParam !== null)
  ? parseInt(hourParam)
  : now.getHours();

const today = now.getDay();
const nextDay = (today + 1) % 7;

const app = document.getElementById("app");

const labelsDay = [
  "Morgens:",
  "Frühstück:",
  "Mittagessen:",
  "Nachmittags:",
  "Abendessen:",
  "Abends:"
];

const labelsNight = [
  "Morgen früh:",
  "dann:"
];

const wochentage = [
  "Sonntag","Montag","Dienstag",
  "Mittwoch","Donnerstag","Freitag","Samstag"
];

function getTyp(day) {
  return (day >= 1 && day <= 5) ? "Werktags" : "Wochenende";
}

function renderDay() {

  document.body.className = "day";

  app.innerHTML = `
    <h1 id="title"></h1>
    <table id="table">
      <tbody id="tableBody"></tbody>
    </table>
  `;

  const title = document.getElementById("title");
  const tableBody = document.getElementById("tableBody");
  const table = document.getElementById("table");

  title.innerHTML =
    "Heute: <b>" + wochentage[today] + "</b> (" + getTyp(today) + ")";

  // Zeitlogik
  let currentIndex = -1;

  if (hour >= 6 && hour < 8) currentIndex = 0;
  else if (hour >= 8 && hour < 10) currentIndex = 1;
  else if (hour >= 10 && hour < 12) currentIndex = 2;
  else if (hour >= 12 && hour < 18) currentIndex = 3;
  else if (hour >= 18 && hour < 20) currentIndex = 4;
  else if (hour >= 20 && hour < 22) currentIndex = 5;

  for (let i = 0; i < 6; i++) {

    const row = document.createElement("tr");
    const cell1 = document.createElement("td");
    const cell2 = document.createElement("td");

    cell1.innerText = labelsDay[i];
    cell2.innerText = data[today][i] || "";

    if (i < currentIndex) {
      cell1.classList.add("past");
      cell2.classList.add("past");
    }

    if (i === currentIndex) {
      cell1.classList.add("current");
      cell2.classList.add("current");
    }

    row.appendChild(cell1);
    row.appendChild(cell2);
    tableBody.appendChild(row);
  }

  fitTitle(title, app);
  fitTable(table, app, title);

}

function renderNight() {

  document.body.className = "night";

  app.innerHTML = `
    <h1 id="title"></h1>


<div class="message">
  <b>Es ist noch Nachts!</b>
  <span>Weiterschlafen</span>
</div>


    <table id="table">
      <tbody id="tableBody"></tbody>
    </table>
  `;

  const title = document.getElementById("title");
  const tableBody = document.getElementById("tableBody");
  const table = document.getElementById("table");
  const message = document.querySelector(".message");

  title.innerHTML =
    "Heute: <b>" + wochentage[today] + "</b> (" + getTyp(today) + ")";

  for (let i = 0; i < 2; i++) {

    const row = document.createElement("tr");
    const cell1 = document.createElement("td");
    const cell2 = document.createElement("td");

    cell1.innerText = labelsNight[i];
    cell2.innerText = data[nextDay][i] || "";

    row.appendChild(cell1);
    row.appendChild(cell2);
    tableBody.appendChild(row);
  }

  fitTitle(title, app);

const firstLine = message.querySelector("b");

// ganz klein machen (nur zum Messen)
firstLine.style.fontSize = "1px";

// messen
const baseWidth = firstLine.scrollWidth;

// WICHTIG: zurücksetzen!
firstLine.style.fontSize = "";   // ✅ DAS fehlte

const targetWidth = message.clientWidth;

const newFontSize = targetWidth / baseWidth;

message.style.fontSize = newFontSize + "px";

  fitTable(table, app, title, message);

}


// ==============================
// AUTO-SKALIERUNG
// ==============================


function fitTitle(title, container) {

  const totalHeight = container.clientHeight;

  const titleHeight = totalHeight * 0.20;

  title.style.height = titleHeight + "px";

  // Schriftgröße passend zur Höhe
  title.style.fontSize = (titleHeight * 0.45) + "px";
}

function fitTable(table, container, title, extra = null) {

  const row = table.querySelector("tr");
  if (!row) return;

  const rowHeight = row.offsetHeight;

  // ✅ Schrift als Anteil der Zeilenhöhe
  table.style.fontSize = (rowHeight * 0.6) + "px";
}
``
// ==============================
// START
// ==============================
if (hour >= 6 && hour < 22) {
  renderDay();
} else {
  renderNight();
}

</script>

</body>
</html>
